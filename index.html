<script>/* OPAT-GITHUB-SHIM-BEGIN（tools/build_github_pages.py 產生；請勿手改） */
(function () {

    return;
  }
  var CFG = window.OPAT_CONFIG || {};
  var KEY = 'opat_session_v1';
  var pending = [];
  function $(id) { return document.getElementById(id); }
  function getS() { try { return JSON.parse(window.sessionStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function setS(s) { try { if (s) window.sessionStorage.setItem(KEY, JSON.stringify(s)); else window.sessionStorage.removeItem(KEY); } catch (e) {} }
  function txt(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function post(body) {
    if (!CFG.BACKEND_URL) return Promise.reject(new Error('config.js 尚未設定後端網址（BACKEND_URL）'));
    return fetch(CFG.BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify(body), redirect: 'follow', credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); });
  }
  function showLogin(msg) {
    var o = $('opat-login'); if (o) o.hidden = false;
    var m = $('opat-login-msg'); if (m) m.innerHTML = msg ? '<div class="msg warn">' + txt(msg) + '</div>' : '';
  }
  function hideLogin() { var o = $('opat-login'); if (o) o.hidden = true; }
  function call(action, args, ok, fail) {
    var s = getS();
    if (!s || !s.token) { pending.push([action, args, ok, fail]); showLogin(); return; }
    post({ action: action, args: args, session: s.token }).then(function (res) {
      if (res && res.session && res.session.token)
        setS({ token: res.session.token, exp_ms: res.session.exp_ms, idle_ms: res.session.idle_ms, me: s.me });
      if (res && res.ok) { if (ok) ok(res.result); return; }
      if (res && res.relogin) { setS(null); showLogin(res.reason || '請重新登入'); }
      if (fail) fail(new Error((res && (res.reason || res.code)) || '伺服端沒有回應'));
    }).catch(function (e) {
      if (fail) fail(new Error('無法連線到後端（' + (e && e.message || e) + '）。請確認網路，或請管理者確認 config.js 之後端網址'));
    });
  }
  function runner() {
    var ok = null, fail = null, proxy;
    var base = { withSuccessHandler: function (f) { ok = f; return proxy; },
                 withFailureHandler: function (f) { fail = f; return proxy; },
                 withUserObject: function () { return proxy; } };
    proxy = new Proxy(base, { get: function (t, name) {
      if (Object.prototype.hasOwnProperty.call(t, name)) return t[name];
      return function () { call(String(name), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return proxy;
  }

  Object.defineProperty(window.google.script, 'run', { configurable: true, get: runner });
  function flush() { var q = pending.slice(); pending = []; q.forEach(function (c) { call(c[0], c[1], c[2], c[3]); }); }
  function onCredential(resp) {
    var m = $('opat-login-msg'); if (m) m.innerHTML = '<div class="msg ok">驗證中…</div>';
    post({ action: 'login', id_token: resp && resp.credential }).then(function (res) {
      if (!res || !res.ok) { showLogin((res && (res.reason || res.code)) || '登入失敗'); return; }
      setS({ token: res.session.token, exp_ms: res.session.exp_ms, idle_ms: res.session.idle_ms, me: res.me });
      var w = $('opat-me'); if (w) w.textContent = (res.me.display || res.me.email) + '（' + res.me.role + '｜' + res.me.person_id + '）';
      hideLogin(); flush();
    }).catch(function (e) { showLogin('無法連線到後端：' + (e && e.message || e)); });
  }
  function ensureShim() {
    window.google = window.google || {};
    if (!window.google.script || !Object.getOwnPropertyDescriptor(window.google.script, 'run')) {
      Object.defineProperty(window.google, 'script', { configurable: true, value: {} });
      Object.defineProperty(window.google.script, 'run', { configurable: true, get: runner });
    }
  }
  function initGis() {
    ensureShim();   /* Google 登入程式庫載入後，確認 google.script 仍在（不論它如何處理 window.google） */
    if (!(window.google && window.google.accounts && window.google.accounts.id)) { setTimeout(initGis, 200); return; }
    if (!CFG.GOOGLE_CLIENT_ID) { showLogin('config.js 尚未設定 Google 登入用戶端 ID（GOOGLE_CLIENT_ID）'); return; }
    window.google.accounts.id.initialize({ client_id: CFG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: false,
                                           cancel_on_tap_outside: true, ux_mode: 'popup' });
    window.google.accounts.id.renderButton($('opat-gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
  }
  function connTest() {
    var r = $('opat-conn'); r.textContent = '測試中…';
    post({ action: 'ping' }).then(function (res) {
      var d = (res && res.data) || {};
      r.innerHTML = res && res.ok
        ? '<div class="msg ok">後端連線正常：' + txt(d.release_id) + '（' + txt(d.artifact_version) + '）Build ' + txt(d.build_id)
          + '｜驗章 ' + (d.rsa_local ? '本地 RS256' : '退路 tokeninfo') + '｜用戶端 ID ' + (d.client_id_configured ? '已設定' : '★ 控制台未設定') + '</div>'
        : '<div class="msg bad">後端有回應但拒絕：' + txt(res && (res.reason || res.code)) + '</div>';
    }).catch(function (e) { r.innerHTML = '<div class="msg bad">連不到後端：' + txt(e && e.message || e) + '</div>'; });
  }
  function logout() {
    setS(null);
    try { window.google.accounts.id.disableAutoSelect(); } catch (e) {}
    post({ action: 'logout' }).catch(function () {});
    window.location.reload();
  }
  window.addEventListener('DOMContentLoaded', function () {
    var b = $('opat-conn-btn'); if (b) b.addEventListener('click', connTest);
    var lo = $('opat-logout'); if (lo) lo.addEventListener('click', logout);
    var s = getS();
    if (s && s.me) { var w = $('opat-me'); if (w) w.textContent = (s.me.display || s.me.email) + '（' + s.me.role + '｜' + s.me.person_id + '）'; }
    if (!s || !s.token) showLogin();
    initGis();
  });
})();
/* OPAT-GITHUB-SHIM-END */</script>

     部署實測：點一次分頁，apiWorklist 與 apiStabilityPrompt 各送兩次（每次 9～20 s 之後端成本加倍）。

var CALL_READONLY = { apiReadiness:1, apiWorklist:1, apiLoadEpisode:1, apiTaskScreen:1, apiTaskList:1, apiStabilityPrompt:1,
  apiFourAxisGaps:1, apiSystemReview:1, apiFixedAdministration:1, apiOptionList:1, apiDashboard:1, apiTimeline:1,
  apiTeachingCards:1, apiPatientList:1, apiScreen:1, apiAttributionNotice:1, apiPharmacyReviewChecks:1, apiAuditTrail:1 };
var CALL_INFLIGHT = {};
var CALL_STATS = { issued: {}, deduped: {} };
function callKey(name, args){ try { return String(name) + '|' + JSON.stringify(args); } catch (e) { return null; } }

          + '。你填的內容仍在畫面上，未送出；請稍後再試一次。';
  var out = el('result') || el('view');
  if (out) out.insertAdjacentHTML('afterbegin', '<div class="msg bad">' + esc(msg) + '</div>');
  Array.prototype.forEach.call(document.querySelectorAll('button.act'), function(b){ b.disabled=false; });
}
function call(onOk, onFail){

    return function(){
      var args = Array.prototype.slice.call(arguments), nm = String(name);
      var ro = !!CALL_READONLY[nm], key = callKey(nm, args);

      if (key) CALL_INFLIGHT[key] = ent;
      CALL_STATS.issued[nm] = (CALL_STATS.issued[nm] || 0) + 1;
      function done(){ if (key && CALL_INFLIGHT[key] === ent) delete CALL_INFLIGHT[key]; }

        .withSuccessHandler(function(r){ done(); ent.subs.forEach(function(s){ if (s[0]) s[0](r); }); })
        .withFailureHandler(function(e){ done(); callFailUi(e); ent.subs.forEach(function(s){ if (s[1]) s[1](e); }); });

}
/** 設定目前療程（清掉上一位病人之畫面狀態），不換頁。 */

  if (!ep || !pr) return false;

  STATE.episode_id = ep; STATE.patient_ref = pr;

}

function openEpisode(ep, pr){
  if (!ep || !pr) { el('view').insertAdjacentHTML('afterbegin',
    msg('bad', '缺療程識別或病人代號。請從清單開啟，或按「新增療程」由系統產生。')); return; }
  /* R44／NEG-ID-02：切換病人時把上一位病人的每一項畫面狀態清掉。
     殘留一格就足以讓人把 A 的數值當成 B 的——這是最典型的錯誤病人事故起點。 */
  clearPatientState();

function emergencyNotice(){
  return '<div class="msg bad" role="alert" style="font-weight:600">本頁為非急症管道（不是急診，也不會有人即時看到）。'
       + '如果出現發燒、畏寒、呼吸困難、意識改變、注射部位紅腫熱痛或滲液等狀況，'
       + '請立刻依照你的 OPAT 聯絡卡撥打 24 小時緊急聯絡電話；情況危急時直接前往急診或撥打 119（緊急醫療路徑）。'
       + '本頁填寫的內容不會即時被人看到。</div>';
}

/* ── 這位病人 ──────────────────────────────────────────────────── */
function renderPatient(){

  var _emr = emergencyNotice();
  call(function(r){
    var d = r.data || {};
    if (!r.ok) { el('view').innerHTML = msg('bad', '載入失敗：' + esc(r.error)); return; }
    if (d.state === 'BLOCKED') {
      var why = d.blocked_by === 'EPISODE_NOT_FOUND' ? (d.retracted ? '此療程之現行紀錄已撤回（RETRACTS）；系統不回舊值。' : '儲存層沒有這個療程。若是新病人，請到「我要填的」建立第一筆並儲存。')
              : d.blocked_by === 'SCOPE_NOT_GRANTED' ? '你對這個療程沒有範圍授權，因此不顯示任何內容。' : (d.reason || zhBlock(d.blocked_by));
      var _fresh = d.blocked_by === 'SCOPE_NOT_GRANTED' && STATE.issuedEpisodes[String(STATE.episode_id)];
      if (_fresh) why = '這是你剛取得、尚未儲存的療程編號：儲存層沒有這個療程。若是新病人，請到「我要填的」建立第一筆並儲存。';
      el('view').innerHTML = msg(_fresh ? 'warn' : 'bad', esc(why));
      if (d.blocked_by === 'EPISODE_NOT_FOUND' || _fresh) el('view').innerHTML += msg('warn', '建立療程之後，建立者會自動取得該療程之範圍授權。');

    }
    STATE.episode = d;
    if (d.plan) STATE.versions.PLAN = d.plan.record_version;
    /* R50：衍生顯示欄（CrCl、系統警示、處方摘要、標籤使用期限）由伺服端算好後投影進來。
       這些鍵不是可寫欄位——畫面對 DERIVED 一律 disabled，儲存時 querySelector 也排除 disabled，
       因此不會被送回伺服端。 */
    if (d.episode) STATE.values = Object.assign({}, d.plan ? d.plan.payload : {}, d.episode,
                                                (d.state && d.state.derived_display) || {});
    var st = d.state || {};
    var h = _emr + renderAxes(st.axes, st.missing_by_axis);
    /* R61／N16：療法組合建議（唯讀；須醫師確認，不寫入處方欄）。 */
    var _rs = (st.derived_display || {}).regimen_suggestion;
    if (_rs) h += renderRegimenSuggestion(_rs);
    var f = d.facts || {};
    h += '<div class="card"><h2>療程事實（病人層）</h2><div class="sub">由建立療程時之伺服端身分與各職類填寫；計畫改版不改變這些事實。</div><div class=\"tblwrap\"><table>';
    /* R50：原本只列六組，eligibility（收案關卡）、allergy（六因子判定）、lifecycle（療程狀態）
       三組計算完之後沒有任何畫面呈現路徑——算了給誰看？ */
    ['context','infection','regimen','eligibility','allergy','lifecycle','consent','response','contacts'].forEach(function(g){
      var o = f[g] || {}; Object.keys(o).forEach(function(k){
        if (/_source$|_source_note$|_domain$/.test(k)) return;   /* 來源註記另行呈現 */
        /* R53：「還沒有人填」與「還沒有地方可以填」要分得出來。
           前者是待辦，後者是未施工——顯示成同一句「未填」等於把未施工說成待辦。 */
        var notBuilt = (o[k + '_source'] === 'NOT_BUILT') || (o[k] == null && o[k + '_source'] === 'NOT_BUILT');
        var srcKey = k.replace(/_status$/, '') + '_source';
        var nb = (o[srcKey] === 'NOT_BUILT');
        var cell = (o[k] != null) ? esc(o[k])

        var note = nb && o[srcKey + '_note'] ? '<div class="fieldnote">' + esc(o[srcKey + '_note']) + '</div>' : '';
        h += '<tr><td>' + esc(k) + '</td><td>' + cell + note + '</td></tr>'; }); });
    h += '</table></div>';
    if (f.conditional_missing && f.conditional_missing.length)
      h += msg('warn', '<b>前提成立但尚未填的欄位：</b><br>' + f.conditional_missing.map(function(m){ return '・' + esc(m.key) + '：' + esc(m.why); }).join('<br>'));
    if (f.inconsistencies && f.inconsistencies.length)
      h += msg('bad', '<b>彼此不一致：</b><br>' + f.inconsistencies.map(function(m){ return '・' + esc(m.why); }).join('<br>'));
    if (d.administration_route) h += '<div class="sub">給藥路徑：' + esc(d.administration_route.status === 'OK' ? (d.administration_route.route + '（' + d.administration_route.action_id + '）') : d.administration_route.reason) + '</div>';
    if (d.contacts && d.contacts.applies) h += (d.contacts.ready ? msg('ok', '居家聯絡窗口與返院動線已填。') : msg('warn', '居家給藥尚缺：' + d.contacts.missing.map(function(m){ return esc(m.key); }).join('、')));
    if (d.outcome) h += '<div class="sub">成果：' + esc(d.outcome.evaluable ? '可評價' : d.outcome.reason) + '</div>';

    h += '<div class="card"><h2>教學卡片</h2><div class="sub">依已核准可顯示之警示與體積契約產生；未核准顯示者不出文字。</div>'
       + '<button class="act secondary" id="tcbtn">載入教學卡片</button><div id="tcbox"></div></div>';
    h += '</div>';
    /* ★ R61／N26：Vancomycin 連續輸注 TDM 計算（只計算、不寫入處方）。僅在本療程成分為 vancomycin 時出現。 */
    if (String(STATE.values.ingredient_id || '') === 'ING-VAN') h += vancoTdmCard();
    /* ★ R61／N29：病人衛教單（工作人員列印交付；病人不直接開網頁） */
    h += '<div class="card"><h2>病人衛教單</h2><div class="sub">由系統依本療程成分與裝置組成；未核准之內容或未設定 24 小時聯絡電話時，'
       + '只能以「草案預覽」列印（帶浮水印，不得交付病人）。單張只含去識別代號。</div>'
       + '<button class="act secondary" id="hobtn">產生衛教單</button><div id="hobox"></div></div>';
    h += '<div class="card"><h2>計畫</h2><div class="sub">' + (d.plan ? ('現行第 ' + esc(d.plan.record_version) + ' 版') : '此療程尚無計畫') + '</div>'
       + (d.plan ? '<button class="act secondary" id="newdraft">同病人開新計畫（依帶入政策預帶）</button>' : '') + '</div>';
    /* ★ R60／K0：送出治療計畫（ACT-02）。
       在本輪之前醫師端只有「建立或編輯」（ACT-01）——也就是說「送出」這個
       臨床決定在系統裡不存在，藥師覆核的其實是一份還在編輯中的計畫。
       送出後上游一變即失效（SUPERSEDED），下游必須看得出來。 */
    if (d.plan) {
      var _ps = d.plan_submission || null;
      h += '<div class="card"><h2>送出治療計畫</h2><div class="sub">'
         + '送出之後進入藥師覆核；上游（成分、劑量、頻次、療程天數、起日、裝置、品項）'
         + '一變，原送出即失效，必須重新送出。撤回需填理由代碼。</div>'
         + '<div class="sub">目前：<b id="psstate">'

         + '<div id="psbox"></div></div>';
    }
    /* R42／DQ-R42-02：提出交班 */
    h += '<div class="card"><h2>交班（責任轉移）</h2><div class="sub">提出→接受→進行→結果→結案；每一步的人與時間由伺服端記。時間線上有資料不等於責任已轉移。</div>'
       + '<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="ho_task" placeholder="任務代碼（19_選項_交班任務）" style="max-width:260px"><button class="act secondary" data-ho="OFFER">提出交班</button></div>'
       + renderHandoffs(d.handoffs || [], '此療程之交班') + '</div>';

       時間線記的是臨床事件，稽核軌記的是操作——兩者不同，因此另設一張卡。
       畫面只依身分決定要不要顯示入口；能不能看仍由伺服端 _RBAC 與範圍授權判定。 */
    h += '<div class="card"><h2>稽核軌調閱</h2><div class="sub">'
       + '唯讀。★ 這個動作本身也會留痕：誰、什麼時候、看了哪一個療程、回了幾筆。'
       + '沒有調閱職類或沒有此療程範圍授權者，按下去會被伺服端擋下。</div>'
       + '<button class="act secondary" id="audbtn">調閱此療程之稽核軌</button>'
       + '<div id="audbox"></div></div>';
    /* R42／DQ-R42-03：時間線唯讀投影 */
    var tl = d.timeline || { events: [] };
    h += '<div class="card"><h2>時間線（唯讀投影）</h2><div class="sub">每一筆是儲存層的一個版本；更正與撤回以新紀錄連回原紀錄，原紀錄保留並標示。稽核軌不在此（那記的是操作，不是臨床事件）。</div>';
    if (!tl.events.length) h += '<div class="fieldnote">尚無紀錄</div>';
    else { h += '<div class=\"tblwrap\"><table><tr><th>#</th><th>時間（伺服端）</th><th>實體</th><th>版</th><th>關係</th><th>誰</th><th>改了哪些欄</th><th>狀態</th></tr>';
      tl.events.forEach(function(e){ h += '<tr><td>' + esc(e.seq) + '</td><td>' + esc(e.saved_at||'') + '</td><td>' + esc(e.entity) + '</td><td>' + esc(e.record_version) + '</td><td>' + esc(e.relation) + (e.corrects_record_id ? '→' + esc(e.corrects_record_id) : '') + '</td><td>' + esc(e.actor_id||'') + '（' + esc(e.actor_role||'') + '）</td><td>' + esc((e.fields_changed||[]).join('、')) + '</td><td>' + (e.retracted_by ? '已撤回' : (e.corrected_by ? '已被更正' : '')) + '</td></tr>'; });
      h += '</table></div>'; }
    h += '</div>';
    /* ★ R60／L8：署名（Attribution）。
       CC BY-NC 與政府資料開放授權條款都把姓名標示寫成義務，未標示即失去授權。
       ★ 這一塊不是說明文字，是授權義務的履行——所以它渲染在畫面上，

    h += '<div class="card"><h2>資料來源與授權標示</h2><div class="sub">'

    renderAttribution();
    bindCourseControl();

    bindVancoTdm();
    if (el('hobtn')) el('hobtn').addEventListener('click', doHandout);

    /* ★ R62：四軸缺項、調製後安定性提示、系統覆核與藥師再覆核、醫師結案 */
    renderR62Patient();
  }).apiLoadEpisode({ episode_id: STATE.episode_id });
}
/* ★ R61／N26：Vancomycin 連續輸注 TDM 卡。輸入只用數字與下拉；結果不寫入任何欄位。 */

    + '只計算、不寫入處方；調整劑量須由醫師開立。規則讀自 160_TDM政策（依據見「資料來源與授權標示」）。</div>'

    + '<div><label>目前每日劑量（mg）</label><input type="number" step="10" min="0" id="vt_cur" value="' + esc(v.daily_dose != null ? v.daily_dose : '') + '"></div>'

function bindVancoTdm(){
  var b = el('vt_go'); if (!b) return;
  b.addEventListener('click', function(){
    el('vt_box').innerHTML = '<div class="fieldnote">計算中…</div>';
    call(function(r){
      var d = r.data || {};
      if (!r.ok || d.state !== 'OK') { el('vt_box').innerHTML = msg('bad', esc((d && (d.reason || zhBlock(d.blocked_by))) || r.error || '無法計算')); return; }
      var h = '<div class="sub">狀態：<b>' + esc(zhStatus(d.status)) + '</b></div>';
      if (d.auc24 != null) h += '<div>AUC24（Css×24）：<b>' + esc(d.auc24) + '</b> mg·h/L</div>';
      if (d.target) h += '<div>目標：Css ' + esc(d.target.css_low) + '–' + esc(d.target.css_high) + ' mg/L（AUC ' + esc(d.target.auc_low) + '–' + esc(d.target.auc_high) + '）</div>';
      if (d.current_mg_kg_day != null) h += '<div>目前：' + esc(d.current_mg_kg_day) + ' mg/kg/日</div>';
      if (d.suggested_daily_mg) h += '<div>換算每日劑量：<b>' + esc(d.suggested_daily_mg.low) + '–' + esc(d.suggested_daily_mg.high) + ' mg</b>（每小時 '
        + esc(d.suggested_rate_mg_h.low) + '–' + esc(d.suggested_rate_mg_h.high) + ' mg'
        + (d.suggested_mg_kg_day ? '；' + esc(d.suggested_mg_kg_day.low) + '–' + esc(d.suggested_mg_kg_day.high) + ' mg/kg/日' : '') + '）</div>';
      (d.reasons || []).forEach(function(x){ h += '<div class="fieldnote">・' + esc(x) + '</div>'; });
      if ((d.warnings || []).length) h += '<div class="fieldnote">警示碼：' + esc(d.warnings.join('、')) + '</div>';
      el('vt_box').innerHTML = h;
    })['apiVancoTdm']({ episode_id: STATE.episode_id, css_mg_L: el('vt_css').value, hours_since_start_or_change: el('vt_hrs').value,
                        current_daily_mg: el('vt_cur').value, weight_kg: el('vt_wt').value, target_scope: el('vt_scope').value || null,
                        renal_unchanged_confirmed: el('vt_renal').value === 'TRUE' });
  });
}

function newDraft(){

function renderHandoffs(list, title){

function openHandoffPicker(btn, action, ep, task, pr, ver){

    var opts = [];

      var rows = (r.ok && r.data && r.data.rows) || [];
      opts = rows.filter(function(x){ return x.record_id; })
                 .map(function(x){ return { v: x.record_id,
                        t: (x.entity || '') + '　' + (x.at || '') + '　' + (x.actor || '') }; });
    } else {
      var os = (r.ok && r.data && r.data.options) || [];
      opts = os.map(function(x){ return { v: x.code, t: (x.label || x.code) }; });

    if (!opts.length) {

        ? '<b>這個療程還沒有可以當作結果參照的落盤紀錄。</b><br>請先完成並儲存該筆紀錄，再回來記結果。'
        : '<b>82_選項_理由代碼 目前沒有任何已核准的選項。</b><br>拒接理由必須可統計，因此不接受自由輸入；請先由院內核定理由代碼。';

            + esc(zhBlock(d.blocked_by) || r2.error || d.status || '') + '。' + esc(d.reason || '')));
          btn.disabled = false; return;
        }
        loadWorklist();
      })['apiHandoff'](req);
    });
  })[isResult ? 'apiTimeline' : 'apiOptionList'](isResult ? { episode_id: ep } : { sheet: '82_選項_理由代碼', field: 'handoff_decline_reason' });

function renderVerdict(){

function assembleInput(){

function runAssemble(){

/* ══ R60 批次 F（F1＋F2）：「我要填的」改為 task-scoped ══════════════

/* ★ R62-INTAKE-01：單一欄位之渲染抽成一個函式，任務畫面與「建立療程第一步（收案）」共用——
   兩處若各自手寫欄位，就會再一次出現「同一件事兩個輸入點、量測只量得到其中一個」（R62-INTAKE-DUP-01）。 */
function taskFieldHtml(f, val, entities){
    var k = f.engine_key || f.field_id, html = '';
    if (f.entity && f.editable) entities[f.entity] = true;
    var blocked = f.required && f.input_type==='DROPDOWN' && (!f.options || !f.options.length);
    var sw = f.show_when ? ' data-sw-key="' + esc(f.show_when.key) + '" data-sw-op="' + esc(f.show_when.op) + '" data-sw-val="' + esc(f.show_when.value==null?'':f.show_when.value) + '"' : '';
    html += '<div class="fld ' + (blocked?'blocked ':'') + (f.exception_only?'exc ':'')
          + '" data-fid="' + esc(f.field_id) + '" data-task-state="' + esc(f.task_state) + '"' + sw
          + ' style="padding:6px;border-radius:4px">';
    html += '<label>' + esc(f.label) + (f.required && f.editable ?' <span class="req">＊</span>':'') + '</label>';
    /* ★ 唯讀欄位一律 disabled 且不帶 data-k：它們不是「可以填但先別填」，
       而是這一件事裡本來就不該由這個人輸入的東西。 */
    if (!f.editable) {
      html += '<input disabled value="' + esc(val==null||val===''?'（由系統帶入）':val) + '">';
      html += '<div class="fieldnote">' + esc(f.task_state === 'EXCEPTION_ONLY' ? '例外時才需要處理' : '系統帶入，供你確認') + '</div>';
      html += '</div>';
      return html;
    }
    var attrs = ' data-k="' + esc(k) + '" data-entity="' + esc(f.entity||'') + '"' + (f.required?' required':'');
    if (f.input_type === 'DROPDOWN') {
      if (f.multi) html += multiSelect(attrs, f, val, blocked);
      else {
      html += '<select' + attrs + (blocked?' disabled':'') + '><option value="">' + (blocked ? '（尚無可選項目）' : '請選擇') + '</option>';
      (f.options||[]).forEach(function(o){ html += '<option value="' + esc(o.value) + '"' + (String(val)===String(o.value)?' selected':'') + '>' + esc(o.label) + '</option>'; });
      html += '</select>';
      }
    } else if (f.input_type === 'DERIVED') {
      html += '<input disabled value="' + esc(val!=null && val!=='' ? val : '（由系統帶入）') + '">';
    } else if (f.input_type === 'SCAN') {
      /* R61／N2：掃碼擷取。條碼掃描器以鍵盤楔形送入；伺服端解析驗證，不符即拒收。 */
      html += '<input type="text" data-capture="SCAN" autocomplete="off" spellcheck="false"' + attrs + ' value="' + esc(val==null?'':val) + '" placeholder="請以條碼掃描器掃描">';
      html += '<div class="fieldnote">掃碼擷取；無法掃碼請改走例外並選擇理由</div>';
    } else if (f.input_type === 'CHECKBOX') {
      html += '<input type="checkbox"' + attrs + (val===true||String(val).toUpperCase()==='TRUE'?' checked':'') + '>';
    } else {
      var t = f.input_type==='NUMBER'?'number':(f.input_type==='DATE'?'date':'text');
      html += '<input type="' + t + '"' + attrs + ' value="' + esc(val==null?'':val) + '">';
    }
    if (f.note) html += '<div class="fieldnote">' + esc(f.note) + '</div>';
    html += '</div>';
    return html;
}
/* R60／F1：task-scoped 渲染。

  }

        + ents.map(function(e){ return '<button class="act" data-save="' + esc(e) + '" style="margin-right:8px;margin-bottom:6px">儲存到 ' + esc(e) + '</button>'; }).join('')
        + (ents.length ? '' : '<div class="fieldnote">這一件事沒有需要你輸入的欄位。</div>')
        + '</div>';
  /* ★ R60／J3：系統算出來、由人確認的那一組設定。

  html += '<div id="confbundle"></div>';

  if (el('expandexc')) el('expandexc').addEventListener('click', function(){ loadTaskScreen(STATE.taskId, true); });
  applyShowWhen();

/* ── R60／J3：確認系統建議之設定組合（ACT-32） ──────────────────
   ★ 不做逐欄 checkbox：六個勾選框不會讓人看得更仔細，
     只會讓確認變成六次機械動作。
   ★ 但一定要說出「自上次確認以來哪幾格變了」——
     否則使用者只會看到一個要他再按一次的按鈕，而不知道為什麼。 */
var CONF_DOMAIN_ZH = {
  PRESCRIPTION: '處方內容（醫師負責）',
  PHARMACY_PREPARATION: '調配配方（藥師負責）',
  DELIVERY_DEVICE: '遞送裝置組態（藥師負責）',
  VASCULAR_ACCESS: '血管通路（護理師負責）'

var CONF_ZH = {
  CURRENT: '已確認且上游未變',
  NEVER_CONFIRMED: '尚未確認',
  STALE: '上游已變，先前的確認不再算數',
  UNDETERMINED: '目前算不出來（不得當成已確認）',
  NOT_APPLICABLE: '這一件事沒有需要確認的系統建議值'
};
function loadConfirmBundle(){
  var host = el('confbundle'); if (!host) return;
  if (!STATE.taskId) { host.innerHTML = ''; return; }
  host.innerHTML = '<div class="card"><div class="sub">載入系統建議值…</div></div>';
  call(function(r){
    var d = r.data, host = el('confbundle'); if (!host) return;
    if (!r.ok || !d) { host.innerHTML = ''; return; }
    if (d.applicable === false || d.status === 'NOT_APPLICABLE') { host.innerHTML = ''; return; }
    if (d.state === 'BLOCKED') {
      host.innerHTML = '<div class="card"><h2>系統建議之設定</h2>'
        + msg('warn', esc(zhBlock(d.blocked_by || '') || '') + '：' + esc(d.reason || '')) + '</div>';
      return;
    }
    /* ★ R60／K1：一個課責領域一張卡、一顆按鈕。
       把處方、調配配方、遞送裝置與血管通路混成一次點擊，
       等於沒有人真的為其中任何一項負責（2026 BSAC/BIA 之職責分工）。 */
    var bundles = d.bundles || (d.bundle_id ? [d] : []);
    if (!bundles.length) { host.innerHTML = ''; return; }
    var h = '';
    bundles.forEach(function(bd, bi){

             + '</td><td class="fieldnote">' + esc(f.invalidated_by || '（未宣告失效上游）')
             + '</td></tr>'; }).join('');
      var can = bd.status === 'NEVER_CONFIRMED' || bd.status === 'STALE';
      h += '<div class="card"><h2>' + esc(CONF_DOMAIN_ZH[bd.domain] || bd.domain || '系統建議之設定')
         + '（需要確認）</h2>'

         + '這些值由系統依處方算出來，不需要你輸入；但需要負責的人確認一次。'
         + '任何一個依據改變時，先前的確認會自動失效。</div>'
         + msg(bd.status === 'CURRENT' ? 'ok' : (bd.status === 'UNDETERMINED' ? 'bad' : 'warn'),
               '<b>' + esc(CONF_ZH[bd.status] || bd.status) + '</b>'
               + (bd.confirmed_by ? '（' + esc(bd.confirmed_by) + '　' + esc(bd.confirmed_at || '') + '）' : '')
               + (bd.detail ? '<br>' + esc(bd.detail) : ''))
         + '<table><thead><tr><th>項目</th><th>目前值</th><th>依據（一變即需重新確認）</th></tr></thead><tbody>'
         + rows + '</tbody></table>';
      if (can) {
        h += '<button class="act" id="confbtn' + (bi ? String(bi) : '') + '" data-domain="'
           + esc(bd.domain || '') + '">確認這一組（'
           + esc(String((bd.field_ids||[]).length)) + ' 項）</button>'
           + '<div class="fieldnote">確認會記下你是誰、什麼時候、依據哪一版上游。'

      }

                             values: STATE.values || {} });
}

/* R50：步驟導覽。每一步標出「必填已填／必填總數」，讓人知道還差什麼而不必逐格捲動。 */
function stepProgress(card){
  var req = 0, done = 0;
  Array.prototype.forEach.call(card.querySelectorAll('.fld:not(.hidden) [data-k]'), function(x){
    if (!x.hasAttribute('required') || x.disabled) return;
    req++;
    var v = (x.type === 'checkbox') ? x.checked : (x.multiple ? selectedValues(x) : x.value);
    if (v !== '' && v !== null && v !== undefined && v !== false) done++;
  });
  return { req: req, done: done };
}
function buildStepNav(){
  var host = el('stepbtns'); if (!host) return;
  var cards = el('form').querySelectorAll('.stepcard');
  var h = '';
  Array.prototype.forEach.call(cards, function(c, i){
    var p = stepProgress(c);
    var mark = p.req === 0 ? '' : (p.done === p.req ? ' ✓' : ' ' + p.done + '/' + p.req);
    h += '<button class="act secondary stepbtn" data-go="' + i + '" style="margin:0 6px 6px 0">第 '
       + esc(c.getAttribute('data-step')) + ' 步' + esc(mark) + '</button>';
  });
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ showStep(Number(b.getAttribute('data-go'))); });
  });
}
function showStep(i){
  var cards = el('form').querySelectorAll('.stepcard');
  if (!cards.length) return;
  if (i < 0) i = 0; if (i >= cards.length) i = cards.length - 1;
  STATE.stepIndex = i;
  Array.prototype.forEach.call(cards, function(c, k){ c.style.display = (k === i) ? '' : 'none'; });
  Array.prototype.forEach.call(el('form').querySelectorAll('.stepbtn'), function(b, k){
    b.setAttribute('aria-selected', k === i ? 'true' : 'false');
    b.style.background = (k === i) ? 'var(--blue)' : '#fff';
    b.style.color = (k === i) ? '#fff' : '';
  });
  var nav = el('stepmove');
  if (nav) nav.parentNode.removeChild(nav);
  var cur = cards[i];
  var d = document.createElement('div'); d.id = 'stepmove'; d.style.marginTop = '10px';
  d.innerHTML = (i > 0 ? '<button class="act secondary" id="prevstep">← 上一步</button> ' : '')
              + (i < cards.length - 1 ? '<button class="act" id="nextstep">下一步 →</button>' : '<span class="fieldnote">已是最後一步；請於下方「儲存」送出。</span>');
  cur.appendChild(d);
  if (el('prevstep')) el('prevstep').addEventListener('click', function(){ showStep(i - 1); });
  if (el('nextstep')) el('nextstep').addEventListener('click', function(){ showStep(i + 1); });
}
function onInput(e){
  var x = e.target; if (!x || !x.getAttribute) return;
  if (x.id === 'f_ep') { STATE.episode_id = x.value.trim(); renderBanner(); return; }
  if (x.id === 'f_pr') { STATE.patient_ref = x.value.trim(); renderBanner(); return; }
  var k = x.getAttribute('data-k'); if (!k) return;
  STATE.values[k] = (x.type === 'checkbox') ? x.checked : (x.multiple ? selectedValues(x) : x.value);
  STATE.dirty = true; renderDirty(); applyShowWhen(); buildStepNav();
}
/* 條件展開（Show_When）：前提不成立即隱藏並清空該欄，避免把過期值一起送出 */
function applyShowWhen(){
  Array.prototype.forEach.call(el('form').querySelectorAll('.fld[data-sw-key]'), function(div){
    var key = div.getAttribute('data-sw-key'), op = div.getAttribute('data-sw-op'), want = div.getAttribute('data-sw-val');
    var cur = STATE.values[key]; var curS = (cur === true) ? 'TRUE' : (cur === false ? 'FALSE' : String(cur==null?'':cur));
    var showIt = (op === 'NOT_BLANK') ? curS !== '' : curS.toUpperCase() === String(want).toUpperCase();
    div.classList.toggle('hidden', !showIt);
    if (!showIt) { var inp = div.querySelector('[data-k]'); if (inp) { var k = inp.getAttribute('data-k'); if (STATE.values[k] !== undefined && STATE.values[k] !== '') { delete STATE.values[k]; if (inp.type==='checkbox') inp.checked=false; else inp.value=''; } } }
  });
}
/* 儲存：依落點實體分組；只送這個角色可寫、目前顯示中、非衍生之欄位 */
function save(entity, btn){
  var out = el('result');
  if (!STATE.episode_id || !STATE.patient_ref) { out.innerHTML = msg('bad', '還不能儲存：請先填病人識別與療程識別。系統不提供任何預設值。'); return; }
  var payload = {}, missingReq = [];
  Array.prototype.forEach.call(el('form').querySelectorAll('.fld:not(.hidden) [data-k]'), function(x){
    if (x.getAttribute('data-entity') !== entity || x.disabled) return;
    var k = x.getAttribute('data-k');
    var v = (x.type === 'checkbox') ? x.checked : (x.multiple ? selectedValues(x) : x.value);
    if (x.type === 'checkbox') { payload[k] = v; return; }
    if (v !== '') payload[k] = v; else if (x.hasAttribute('required')) missingReq.push(k);
  });
  if (!Object.keys(payload).length) { out.innerHTML = msg('warn', '這一組還沒有填任何可儲存的欄位。'); return; }
  var note = missingReq.length ? msg('warn', '仍有必填未填：' + esc(missingReq.join('、')) + '。可以先存草稿，但判定會停在 UNKNOWN。') : '';
  btn.disabled = true; btn.textContent = '儲存中…';
  call(function(r){
    btn.disabled = false; btn.textContent = '儲存到 ' + entity;
    if (!r.ok) { out.innerHTML = msg('bad', '儲存失敗：' + esc(r.error)); return; }
    var d = r.data || {};
    if (d.blocked_by === 'ACTION_NOT_AUTHORIZED') { out.innerHTML = msg('bad', '<b>這個動作目前沒有被授權，已擋下並記錄。</b><br>' + esc(d.reason || '') + '<br><b>缺什麼、誰能補：</b><br>' + (d.missing || []).map(function(x){ return '・' + esc(x); }).join('<br>')); return; }
    if (d.blocked_by === 'FIELD_NOT_WRITABLE_BY_ROLE') { var v = (d.field_authz && d.field_authz.violations) || [];
      out.innerHTML = msg('bad', '<b>這些欄位不屬於你的角色，已擋下並記錄：</b><br>' + v.map(function(x){ return '・' + esc(x.field) + '（' + esc(x.detail) + '）'; }).join('<br>')); return; }
    if (d.blocked_by === 'ENTITY_NOT_ALLOWED') { out.innerHTML = msg('bad', '<b>儲存實體不合法：</b>' + esc(d.reason)); return; }
    if (d.blocked_by === 'STORE_INTEGRITY') { out.innerHTML = msg('bad', '<b>試算表被人繞過系統改動過，已停止寫入。</b><br>' + esc(d.reason) + '<br>' + esc(d.remediation || '')); return; }
    if (d.blocked_by === 'IDENTITY_UNTRUSTED') { out.innerHTML = msg('bad', '<b>無法確認你是誰，因此不寫入。</b><br>' + esc(d.reason)); return; }
    if (d.blocked_by) { out.innerHTML = msg('bad', '<b>未寫入：</b>' + esc(zhBlock(d.blocked_by)) + '。' + esc(d.reason || '')); return; }
    if (d.status === 'VERSION_CONFLICT') { out.innerHTML = msg('warn', '<b>有人在你之前改過同一組。</b>你手上的是第 ' + esc((d.conflict||{}).expected) + ' 版，目前已經是第 ' + esc((d.conflict||{}).actual) + ' 版。請到「這位病人」重新載入後再存，系統不會用你的版本覆蓋別人的。'); return; }
    if (d.status === 'DUPLICATE_IGNORED') { out.innerHTML = msg('ok', '這一筆先前已經存過，未重複寫入。'); return; }
    if (d.status !== 'OK') { out.innerHTML = msg('bad', '未寫入：' + esc(d.status) + (d.missing ? ('（缺 ' + esc(d.missing.join('、')) + '）') : '')); return; }
    STATE.versions[entity] = (d.record && d.record.record_version) || (STATE.versions[entity] || 0) + 1;
    STATE.dirty = false; renderDirty();
    out.innerHTML = note + msg('ok', '<b>已儲存到 ' + esc(entity) + '</b>（第 ' + esc(STATE.versions[entity]) + ' 版，' + esc(Object.keys(payload).length) + ' 個欄位'
      + (d.reported_only ? '，以「提報」存放，非確認值' : '') + '）。舊版一列都沒有被覆蓋。'
      + ((d.server_derived||[]).length ? '<br>伺服端帶入：' + esc(d.server_derived.join('、')) : '')
      + (d.grant && d.grant.written ? '<br>你已自動取得此療程之範圍授權。' : ''));
  }).apiSave({ entity: entity, key: STATE.episode_id, patient_ref: STATE.patient_ref,
               request_id: 'REQ-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
               expected_record_version: STATE.versions[entity] || 0, payload: payload });
}

/* ── 現況與限制 ────────────────────────────────────────────────── */
/* R51：成效指標。
   本頁刻意比照「現況與限制」的揭露風格：算不出來的指標不會從清單裡消失，
   而是留在原地寫出為什麼算不出來。分母為零時顯示的是「沒有人落進分母」，
   不是 0%——這兩件事對看的人完全不同。 */
function renderKpi(){
  el('view').innerHTML = '<div class="card"><div class="sub">載入成效指標…</div></div>';
  call(function(r){
    var d = r.data || {};
    if (!r.ok || d.state !== 'OK') {
      el('view').innerHTML = msg('bad','成效指標載入失敗：' + esc((d && d.reason) || r.error || ''));
      return;
    }
    var h = '<div class="card"><h2>成效指標</h2><div class="sub">'
          + '指標定義（分子、分母、納入、排除、量測窗）一律讀自 _INDICATOR_REGISTRY，'
          + '系統不代為訂定；未經四要件核准之指標不顯示數字。</div>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
          + '<div><label>起日</label><input type="date" id="kpi_from" value="' + esc(STATE.kpiFrom||'') + '"></div>'
          + '<div><label>迄日</label><input type="date" id="kpi_to" value="' + esc(STATE.kpiTo||'') + '"></div>'
          + '<button class="act secondary" id="kpi_go">重新計算</button></div>'
          + '<div class="fieldnote">留空即不限期間。量測窗由院方於指標定義中訂定，'
          + '此處只是把起訖日套上去；系統不自行推導曆月或滾動天數。</div></div>';
    if (!d.total) {
      h += msg('warn','<b>目前沒有任何指標定義。</b><br>' + esc(d.reason || '')
             + '<br>需要感染科、品質管理與教學部依 _INDICATOR_REGISTRY 的欄位定義起始指標，'
             + '並完成四要件核准。');

        /* R62-DOSE-01：需處理之領域選「同意」時必須附理由（說不出理由請選不同意） */
        if (dm.status === 'NEEDS_ATTENTION')
          h += '<select data-rra="' + esc(dm.domain) + '"><option value="">（需處理而同意時）理由</option>'
             + Object.keys(sr.accept_reason_options || {}).map(function(k){ return '<option value="' + esc(k) + '">' + esc(sr.accept_reason_options[k]) + '</option>'; }).join('') + '</select>';
        h += '</td>';
      }
    }
    h += '</tr>';
  });
  h += '</table></div>';
  h += renderDoseReview(sr.dose_review);
  if (!readonly) {
    var rr = sr.pharmacist_rereview;
    h += '<div class="fieldnote">' + (rr ? ('上次再覆核：' + esc(rr.reviewed_by) + '（' + esc(rr.reviewed_at) + '）' + (sr.rereview_current ? '，與目前系統結果一致' : '，★ 已不是目前這一版，請重做')) : '尚未再覆核') + '</div>';
    if ((sr.domains || []).some(function(dm){ return dm.domain === 'VANCO_TDM' && dm.status !== 'NOT_APPLICABLE'; }))
      h += '<div class="grid"><div><label>Vancomycin 穩態濃度 Css（mg/L）</label><input id="rr_css" type="number" step="any"></div>'
         + '<div><label>距開始或上次調整（小時）</label><input id="rr_hrs" type="number" step="any"></div>'
         + '<div><label>腎功能未變（藥師確認）</label><select id="rr_renal"><option value="">請選擇</option><option value="TRUE">是</option><option value="FALSE">否</option></select></div>'
         + '<div><label>目標適用範圍</label><select id="rr_scope"><option value="MRSA_MIC_LE_1">MRSA 且 MIC ≤1</option><option value="OTHER_OR_UNKNOWN">其他或不明</option></select></div></div>';
    h += '<button class="act" id="rr_go" data-fp="' + esc(sr.fingerprint || '') + '">送出藥師再覆核</button><div id="rr_result"></div>';
  }
  return h + '</div>';
}
/* R62-DOSE-01：每日劑量審核卡（範圍、依據等級、CrCl、BMI ≥30 之調整體重結果、出處）。 */
var DR_BASIS_ZH = { CI_LABEL:'仿單／SmPC 連續輸注劑量', CI_STUDY:'連續輸注研究或院際指引', GUIDELINE:'專業學會指引',
                    INFERENCE:'推論（仿單日總量或指引比例換算）', NO_EVIDENCE:'無可用證據' };
function renderDoseReview(dr){
  if (!dr) return '';
  var c = dr.crcl || {};
  var h = '<h3 style="margin:12px 0 4px">每日劑量審核（依腎功能）</h3><div class="fieldnote">審核不是建議劑量：範圍外為「需處理」，由藥師具名決定；不擋醫師收案。</div><div class="tblwrap"><table>'
        + '<tr><th>結果</th><td>' + esc(dr.result_zh || dr.result) + '</td></tr>'
        + '<tr><th>說明</th><td>' + esc(dr.summary || '') + '</td></tr>';
  if (dr.range) h += '<tr><th>審核範圍</th><td>' + esc(dr.range.text || '') + '</td></tr>';
  if (dr.basis_class) h += '<tr><th>依據等級</th><td>' + esc(DR_BASIS_ZH[dr.basis_class] || dr.basis_class) + '（規則 ' + esc(dr.rule_id || '') + '）</td></tr>';
  if (typeof c.crcl === 'number') h += '<tr><th>CrCl（CG，實際體重）</th><td>' + esc(Math.round(c.crcl * 10) / 10) + ' mL/min'
      + (typeof c.crcl_adjbw === 'number' ? '；調整體重 ' + esc(Math.round(c.crcl_adjbw * 10) / 10) + ' mL/min（BMI ' + esc(Math.round(c.bmi * 10) / 10) + '，僅供參考）' : '') + '</td></tr>';
  if (dr.concentration_mg_per_ml != null) h += '<tr><th>最終濃度</th><td>約 ' + esc(dr.concentration_mg_per_ml) + ' mg/mL（每日劑量 ÷ ' + esc(dr.fixed && dr.fixed.final_vol_ml) + ' mL）</td></tr>';
  if ((dr.notes || []).length) h += '<tr><th>附註</th><td>' + dr.notes.map(esc).join('<br>') + '</td></tr>';
  if (dr.review_note) h += '<tr><th>藥師參考</th><td>' + esc(dr.review_note) + '</td></tr>';
  if (dr.dialysis_note) h += '<tr><th>透析／CRRT（僅供顯示）</th><td>' + esc(dr.dialysis_note) + '</td></tr>';
  if ((dr.evidence_keys || []).length) h += '<tr><th>出處</th><td class="fieldnote">' + dr.evidence_keys.map(esc).join('、') + '（見 169_劑量實證登錄）</td></tr>';
  return h + '</table></div>';
}
function bindReReview(){
  var b = el('rr_go'); if (!b) return;
  b.addEventListener('click', function(){
    var dec = {}, rc = {}, ac = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-rr]'), function(s){ dec[s.getAttribute('data-rr')] = s.value; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rrr]'), function(s){ if (s.value) rc[s.getAttribute('data-rrr')] = s.value; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rra]'), function(s){ if (s.value) ac[s.getAttribute('data-rra')] = s.value; });
    var req = { episode_id: STATE.episode_id, system_review_fingerprint: b.getAttribute('data-fp'), decisions: dec, reason_codes: rc, accept_reason_codes: ac,
                request_id: 'RR-' + STATE.episode_id + '-' + b.getAttribute('data-fp') };
    if (el('rr_css') && el('rr_css').value) req.tdm_input = { css_mg_L: el('rr_css').value, hours_since_start_or_change: el('rr_hrs').value,
                                                             renal_unchanged_confirmed: el('rr_renal').value === 'TRUE', target_scope: el('rr_scope').value };
    b.disabled = true;
    call(function(r){ b.disabled = false; var d = r.data || {};
      el('rr_result').innerHTML = (!r.ok || d.state !== 'OK') ? msg('bad', '再覆核未存：' + esc(d.reason || zhBlock(d.blocked_by) || r.error || ''))
        : msg('ok', '已存藥師再覆核（' + esc(d.rereview && d.rereview.reviewed_at) + '）' + (d.rereview && d.rereview.tdm_result ? '；TDM：' + esc(JSON.stringify(d.rereview.tdm_result.status || d.rereview.tdm_result)) : ''));
    }).apiPharmacistReReview(req);
  });
}
/* R62：結案三欄之選項一律取自伺服端（MD_REASSESS 任務畫面之 MD-48／MD-51／MD-50，來源 19_選項_成果分類／19_選項_是否），
   畫面不寫死任何代碼或標籤——院方改了選項或標籤，這裡跟著改；選項來源沒有已核准之列時不顯示結案鈕。 */
var CLOSE_FIELDS = [{ id: 'co_cls', fid: 'MD-48', label: '成果分類' }, { id: 'co_re', fid: 'MD-51', label: '再住院' },
                    { id: 'co_ade', fid: 'MD-50', label: '藥物不良事件' }];
function renderCloseOut(t){
  var fields = (t && t.fields) || [];
  var empty = [];
  var sel = CLOSE_FIELDS.map(function(c){
    var f = fields.filter(function(x){ return String(x.field_id) === c.fid; })[0];
    var opts = (f && f.options) || [];
    if (!opts.length) empty.push(c.label);
    return '<div><label>' + esc(c.label) + ' <span class="req">*</span></label><select id="' + c.id + '"><option value="">請選擇</option>'
         + opts.map(function(o){ return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>'; }).join('') + '</select></div>';
  }).join('');
  return '<div class="card"><h2>醫師結案</h2><div class="sub">成果分類、再住院、藥物不良事件為必填；存檔後療程轉為「完成」，成效指標自動形成。</div>'
    + (empty.length ? msg('warn', '以下欄位之選項來源沒有已核准之列，暫時無法結案：' + esc(empty.join('、'))) : '')
    + '<div class="grid">' + sel + '</div>'
    + (empty.length ? '' : '<button class="act" id="co_go">結案</button>') + '<div id="co_result"></div></div>';
}
function loadCloseOut(boxId){
  var box = el(boxId); if (!box) return;
  box.innerHTML = '<div class="fieldnote">載入結案欄位…</div>';
  call(function(r){ var t = r.data || {};
    if (!el(boxId)) return;
    if (!r.ok || t.ok === false || t.state === 'BLOCKED') { el(boxId).innerHTML = ''; return; }
    el(boxId).innerHTML = renderCloseOut(t); bindCloseOut();
  }).apiTaskScreen({ task_id: 'MD_REASSESS', episode_id: STATE.episode_id });
}
function bindCloseOut(){
  var b = el('co_go'); if (!b) return;
  b.addEventListener('click', function(){
    b.disabled = true;
    call(function(r){ b.disabled = false; var d = r.data || {};
      el('co_result').innerHTML = (!r.ok || d.state === 'BLOCKED') ? msg('bad', '結案未完成：' + esc(d.reason || zhBlock(d.blocked_by) || r.error || ''))
        : msg(d.state === 'OK' ? 'ok' : 'warn', d.state === 'OK' ? '已結案；成效指標將於下一次整理時更新' : esc(d.note || '部分完成'));
    }).apiCloseEpisode({ episode_id: STATE.episode_id, outcome_class: el('co_cls').value, readmission: el('co_re').value,
                         adverse_drug_event: el('co_ade').value, request_id: 'CLOSE-' + STATE.episode_id });
  });
}
function renderR62Patient(){
  var v = el('view'); if (!v || !STATE.episode_id) return;
  v.insertAdjacentHTML('beforeend', '<div id="r62_gaps"></div><div id="r62_stab"></div><div id="r62_rev"></div><div id="r62_close"></div>');
  call(function(r){ var d = r.data || {}; if (el('r62_gaps')) el('r62_gaps').innerHTML = r.ok ? renderGapTable(d) : ''; })['apiFourAxisGaps']({ episode_id: STATE.episode_id });
  loadStability({ episode_id: STATE.episode_id }, 'r62_stab');
  if (STATE.roles.indexOf('RPh') >= 0 || STATE.roles.indexOf('MD') >= 0)
    call(function(r){ var d = r.data || {};
      if (!el('r62_rev')) return;
      el('r62_rev').innerHTML = (!r.ok || d.state === 'BLOCKED') ? '' : renderSystemReview(d, STATE.primary !== 'RPh');
      bindReReview(); })['apiSystemReview']({ episode_id: STATE.episode_id });
  if (STATE.primary === 'MD' && el('r62_close')) loadCloseOut('r62_close');
}
function renderStabilityOverview(boxId){
  var box = el(boxId); if (!box) return;
  call(function(r){ var d = r.data || {};
    if (!r.ok || d.state === 'BLOCKED') { box.innerHTML = ''; return; }
    var sc = ['IMMEDIATE_USE', 'REFRIGERATED_PRESTORAGE', 'INFUSION_BAG_REFERENCE', 'ROUTE_CONTRAINDICATION'];
    var nm = { IMMEDIATE_USE:'一般調製（現配即用）', REFRIGERATED_PRESTORAGE:'預先調製後冷藏', INFUSION_BAG_REFERENCE:'輸液袋參考', ROUTE_CONTRAINDICATION:'給藥途徑' };
    var scopeZh = { ACTIVE:'平台可開立', INACTIVE:'平台停用', CANDIDATE:'候選藥' };
    var h = '<div class="card"><h2>調製後安定性提示總覽</h2><div class="sub">' + esc(d.not_bud_notice || '') + '</div><div class="tblwrap"><table><tr><th>藥品</th><th>範圍</th>'
          + sc.map(function(s){ return '<th>' + esc(nm[s]) + '</th>'; }).join('') + '</tr>';
    (d.items || []).forEach(function(it){
      h += '<tr><td>' + esc(it.drug_display) + '</td><td>' + esc(scopeZh[it.platform_scope] || it.platform_scope || '') + '</td>'
         + sc.map(function(s){ var x = it.lights[s]; return '<td>' + (x ? lightChip(x.light) : '<span class="fieldnote">—</span>') + '</td>'; }).join('') + '</tr>';
    });
    box.innerHTML = h + '</table></div></div>';
  })['apiStabilityPrompt']({ overview: true });
}

boot();
</script>
